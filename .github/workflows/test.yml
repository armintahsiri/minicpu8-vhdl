name: test
on:
  push:
  pull_request:

jobs:
  nvc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nickg/setup-nvc@v1
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Full test suite (includes quick fuzz)
        run: make test
  ghdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GHDL (VHDL-2008)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl
          ghdl --version
      - name: All testbenches under GHDL
        run: make test-ghdl
